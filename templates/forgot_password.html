{% extends "base.html" %}

{% block title %}Password Recovery - NephroScan AI{% endblock %}

{% block content %}
<div class="form-card">
  <div class="glass-card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <h2 style="font-size: 1.6rem; font-weight: 700; margin-bottom: 0.25rem;">Password Recovery</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted);">Enter your registered email address to receive password reset instructions</p>
    </div>

    <form method="POST" action="{{ url_for('forgot_password') }}">
      <div class="form-group">
        <label class="form-label" for="email">Registered Email Address</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="doctor@hospital.org" required autofocus>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.75rem;">
        Send Recovery Instructions
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid rgba(255, 255, 255, 0.08); font-size: 0.85rem; color: var(--text-muted);">
      Remember your credentials? <a href="{{ url_for('login') }}" style="color: var(--cyan-primary); text-decoration: none; font-weight: 600;">Sign in here</a>
    </div>
  </div>
</div>
{% endblock %}
